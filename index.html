<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eid Al Itihad | عيد الاتحاد</title>
<meta name="description" content="Play Eid Al Itihad, a game celebrating UAE National Day, right in your browser.">
<meta name="theme-color" content="#F5E8BE">
<link rel="icon" href="TemplateData/webmemd-icon.png">
<link rel="preload" href="fonts/Oswald.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/NotoNaskhArabic.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{font-family:"Oswald";src:url("fonts/Oswald.ttf") format("truetype");font-weight:200 700;font-display:swap}
  @font-face{font-family:"Noto Naskh Arabic";src:url("fonts/NotoNaskhArabic.ttf") format("truetype");font-weight:400 700;font-display:swap}
  /* Two colours only, sampled from the design image */
  :root{--bg:#F5E8BE;--ink:#AD4901}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:"Oswald","Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px}
  [lang="ar"]{font-family:"Noto Naskh Arabic",serif}
  header{text-align:center;margin:0 0 12px}
  header .logo{display:block;width:min(300px,80vw);height:auto}
  header .ar{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600;line-height:1.3}
  header .en{font-size:clamp(1.1rem,3.6vw,1.5rem);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
  .stage{position:relative;width:min(100%,calc((100vh - 250px) * 9 / 16),calc((100dvh - 250px) * 9 / 16));min-width:min(100%,260px);aspect-ratio:9/16;background:var(--bg);border:3px solid var(--ink);overflow:hidden}
  #unity-canvas{width:100%;height:100%;display:block;background:var(--bg);outline:none}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);text-align:center;padding:16px;transition:opacity .4s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .btn{font:inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--ink);border:3px solid var(--ink);cursor:pointer;padding:10px 28px;font-size:1.1rem;display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
  .btn:hover,.btn:active{background:var(--ink);color:var(--bg)}
  .btn .ar{text-transform:none;letter-spacing:0;font-weight:600}
  .imgbtn{background:none;border:0;padding:0;cursor:pointer;display:inline-block;line-height:0;transition:transform .1s}
  .imgbtn img{display:block;width:180px;height:auto}
  #play img{width:min(200px,60%);width:200px;max-width:100%}
  .imgbtn:hover{transform:scale(1.04)}.imgbtn:active{transform:scale(.97)}
  .imgbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .play{font-size:1.5rem;padding:12px 44px}
  .bar{width:min(260px,75%);height:10px;border:2px solid var(--ink);display:none}
  .bar>div{height:100%;width:0;background:var(--ink);transition:width .2s}
  .pct{display:none;font-size:1.1rem}
  .err{display:none;border:2px solid var(--ink);padding:10px 14px;max-width:90%;font-size:.95rem}
  .controls{margin-top:12px}
  .notice{display:none;margin-top:10px;text-align:center;font-size:.95rem;max-width:420px}
  footer{margin-top:auto;padding-top:20px;font-size:.85rem;letter-spacing:.05em}
  .stage:fullscreen,.stage.pseudo-fs{width:100vw;height:100vh;height:100dvh;min-width:0;max-width:none;margin:0;border:0;aspect-ratio:auto;display:flex;align-items:center;justify-content:center}
  .stage.pseudo-fs{position:fixed;inset:0;z-index:1000}
  .stage:fullscreen #unity-canvas,.stage.pseudo-fs #unity-canvas{width:min(100vw,calc(100dvh * 9 / 16));height:auto;aspect-ratio:9/16;max-height:100dvh}
  body.no-scroll{overflow:hidden;touch-action:none}
  .fs-close{display:none;position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:5;width:44px;height:44px;border:3px solid var(--ink);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
  .stage:fullscreen .fs-close,.stage.pseudo-fs .fs-close{display:block}
</style>
</head>
<body>
<header><img class="logo" src="img/logo.png" alt="عيد الاتحاد Eid Al Etihad, Dec. 02" width="1200" height="393"></header>
<div class="stage" id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <button class="fs-close" id="fs-close" aria-label="Exit fullscreen">✕</button>
  <div class="overlay" id="overlay">
    <button class="imgbtn" id="play" aria-label="ابدأ باللعب Start to play"><img src="img/btn-play.png" alt="" width="600" height="318"></button>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="pct" id="pct">0%</div>
    <div class="err" id="err"></div>
  </div>
</div>
<div class="controls"><button class="imgbtn" id="fs" aria-label="عرض كامل Fullscreen"><img src="img/btn-fullscreen.png" alt="" width="600" height="318"></button></div>
<div class="notice" id="mobile">Tap Fullscreen for the best view.</div>
<footer>© <span id="yr"></span> Eid Al Itihad</footer>
<script src="game.config.js"></script>
<script>
(function(){
  const C = window.GAME_CONFIG, B = "Build/", ext = C.compression || "";
  const $ = id => document.getElementById(id);
  $("yr").textContent = new Date().getFullYear();
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  if (isMobile) $("mobile").style.display = "block";
  let instance = null;

  function showError(msg){ const e=$("err"); e.style.display="block"; e.textContent=msg; $("bar").style.display="none"; $("pct").style.display="none"; }

  $("play").onclick = function(){
    this.style.display="none"; $("bar").style.display="block"; $("pct").style.display="block";
    const s = document.createElement("script");
    s.src = B + C.buildName + ".loader.js";
    s.onerror = () => showError("Couldn't find the game files. Check that the Build folder is uploaded and game.config.js has the right build name.");
    s.onload = () => {
      createUnityInstance($("unity-canvas"), {
        dataUrl: B + C.buildName + ".data" + ext,
        frameworkUrl: B + C.buildName + ".framework.js" + ext,
        codeUrl: B + C.buildName + ".wasm" + ext,
        streamingAssetsUrl: "StreamingAssets",
        companyName: C.companyName, productName: C.productName, productVersion: C.productVersion,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // sharp on phones, capped for performance
        showBanner: (msg, type) => { if (type === "error") showError(msg); else console.warn(msg); }
      }, p => { const v = Math.round(p*100); $("fill").style.width = v+"%"; $("pct").textContent = v+"%"; })
      .then(u => { instance = u; $("overlay").classList.add("hidden"); $("unity-canvas").focus(); })
      .catch(m => showError(String(m)));
    };
    document.body.appendChild(s);
  };

  // Fullscreen: real Fullscreen API where supported (desktop, Android),
  // otherwise (iPhone Safari) make the game fill the screen with CSS.
  const st = $("stage");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const isFs = () => !!fsEl() || st.classList.contains("pseudo-fs");
  function enterFs(){
    const req = st.requestFullscreen || st.webkitRequestFullscreen;
    const pseudo = () => { st.classList.add("pseudo-fs"); document.body.classList.add("no-scroll"); window.scrollTo(0,0); };
    if (req) { try { const r = req.call(st); if (r && r.catch) r.catch(pseudo); } catch(e){ pseudo(); } }
    else pseudo();
    $("unity-canvas").focus();
  }
  function exitFs(){
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    st.classList.remove("pseudo-fs"); document.body.classList.remove("no-scroll");
  }
  $("fs").onclick = () => isFs() ? exitFs() : enterFs();
  $("fs-close").onclick = exitFs;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && st.classList.contains("pseudo-fs")) exitFs(); });
})();
</script>
</body>
</html>
